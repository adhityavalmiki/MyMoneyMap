<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | MyMoneyMap</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="loader"><div class="loader-mark"><i class="fa-solid fa-key"></i></div></div>
  <main class="auth-page">
    <section class="auth-visual">
      <a class="brand" href="index.html"><span class="brand-icon"><i class="fa-solid fa-map"></i></span> MyMoneyMap</a>
      <div><h1>Choose a new password.</h1><p>After opening the reset email link, set a new password for your MyMoneyMap account.</p></div>
    </section>
    <section class="auth-form-wrap">
      <form class="auth-card" id="resetPasswordForm">
        <h2>Reset password</h2>
        <p>Enter a strong new password.</p>
        <div class="success-pop" id="resetSuccess"><i class="fa-solid fa-circle-check"></i> Password updated. Redirecting to login...</div>
        <div class="form-grid">
          <input class="field" id="newPassword" type="password" placeholder="New password" required>
          <input class="field" id="confirmNewPassword" type="password" placeholder="Confirm new password" required>
          <button class="btn" type="submit">Update password</button>
          <a class="btn light" href="login.html">Back to login</a>
        </div>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
