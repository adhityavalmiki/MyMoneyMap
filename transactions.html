<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Transactions | MyMoneyMap</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body><div class="loader"><div class="loader-mark"><i class="fa-solid fa-receipt"></i></div></div><div class="app-shell">
<aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-icon"><i class="fa-solid fa-map"></i></span> MyMoneyMap</a><nav class="sidebar-menu"><a class="nav-item" href="dashboard.html"><i class="fa-solid fa-gauge"></i>Dashboard</a><a class="nav-item" href="transactions.html"><i class="fa-solid fa-receipt"></i>Expenses</a><a class="nav-item" href="subscriptions.html"><i class="fa-solid fa-calendar-days"></i>Subscriptions</a><a class="nav-item" href="portfolio.html"><i class="fa-solid fa-arrow-trend-up"></i>Portfolio</a><a class="nav-item" href="emi.html"><i class="fa-solid fa-calculator"></i>EMI Calculator</a><a class="nav-item" href="settings.html"><i class="fa-solid fa-gear"></i>Settings</a></nav><div class="sidebar-profile"><div class="avatar">A</div><div><strong>Adhitya</strong><br><small>Money mapper</small></div></div></aside>
<main class="main"><header class="topbar"><button class="mobile-toggle" data-sidebar-toggle><i class="fa-solid fa-bars"></i></button><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="txSearch" placeholder="Search transactions"></div><div class="top-actions"><button class="icon-btn" data-theme-toggle><i class="fa-solid fa-moon"></i></button><button class="btn" id="addTxBtn"><i class="fa-solid fa-plus"></i>Add Transaction</button></div></header>
<div class="page-title"><h1>Transaction Manager</h1><p><span id="txCount">0</span> matching records. Add, edit, delete, filter, search, sort, and export finance activity.</p></div>
<div class="toolbar"><select id="txCategory" class="select"><option>All</option><option>Food</option><option>Rent</option><option>Shopping</option><option>Bills</option><option>Healthcare</option><option>Entertainment</option><option>Salary</option><option>Investments</option><option>Transport</option><option>Other</option></select><select id="txSort" class="select"><option value="new">Newest first</option><option value="old">Oldest first</option></select><button class="btn light" id="exportCsv"><i class="fa-solid fa-file-csv"></i>Export CSV</button></div>
<div class="table-wrap"><table><thead><tr><th>Title</th><th>Category</th><th>Type</th><th>Date</th><th>Amount</th><th>Actions</th></tr></thead><tbody id="transactionRows"></tbody></table></div>
</main></div>
<div class="modal-backdrop" id="txModal"><div class="modal"><div class="modal-head"><h2 id="txModalTitle">Add Transaction</h2><button class="icon-btn" id="closeTxModal"><i class="fa-solid fa-xmark"></i></button></div><form class="form-grid" id="txForm"><input type="hidden" id="txId"><input class="field" id="tx-title" placeholder="Title" required><div class="two-col"><input class="field" id="tx-amount" type="number" placeholder="Amount" required><input class="field" id="tx-date" type="date" required></div><div class="two-col"><select class="select" id="tx-category"><option>Food</option><option>Rent</option><option>Shopping</option><option>Bills</option><option>Healthcare</option><option>Entertainment</option><option>Salary</option><option>Investments</option><option>Transport</option><option>Other</option></select><select class="select" id="tx-type"><option value="expense">Expense</option><option value="income">Income</option></select></div><button class="btn" type="submit">Save Transaction</button></form></div></div>
<button class="fab" id="addTxBtn2" onclick="openTransactionModal()"><i class="fa-solid fa-plus"></i></button><script src="js/app.js"></script><script src="js/transactions.js"></script></body></html>
