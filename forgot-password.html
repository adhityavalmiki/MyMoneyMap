<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | MyMoneyMap</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="loader"><div class="loader-mark"><i class="fa-solid fa-envelope"></i></div></div>
  <main class="auth-page">
    <section class="auth-visual">
      <a class="brand" href="index.html"><span class="brand-icon"><i class="fa-solid fa-map"></i></span> MyMoneyMap</a>
      <div><h1>Recover access securely.</h1><p>Enter your account email and we will send a secure password reset link.</p></div>
    </section>
    <section class="auth-form-wrap">
      <form class="auth-card" id="forgotPasswordForm">
        <h2>Forgot password</h2>
        <p>Use the same email you registered with.</p>
        <div class="success-pop" id="forgotSuccess"><i class="fa-solid fa-circle-check"></i> Reset link sent. Check your email.</div>
        <div class="form-grid">
          <input class="field" id="forgotEmail" type="email" placeholder="Email" required>
          <button class="btn" type="submit">Send reset link</button>
          <a class="btn light" href="login.html">Back to login</a>
        </div>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
